<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه فرم‌ساز مسجد امیرالمؤمنین (ع)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#132821;
    --pine:#1F5C4A;
    --pine-deep:#134034;
    --gold:#C9A15A;
    --gold-soft:#E4CE9A;
    --cream:#F7F2E6;
    --cream-2:#EFE7D4;
    --sage:#7C9A8C;
    --danger:#B4483A;
    --radius-arch: 140px 140px 14px 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Vazirmatn',sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(31,92,74,0.06), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(201,161,90,0.10), transparent 45%);
  }
  h1,h2,h3,.display{font-family:'Amiri',serif;}
  a{color:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
  ::selection{background:var(--gold-soft);}

  /* ---------- top bar ---------- */
  .topbar{
    border-bottom:1px solid rgba(19,40,33,0.10);
    background:linear-gradient(180deg, rgba(255,255,255,0.6), transparent);
    position:sticky;top:0;z-index:40;backdrop-filter:blur(6px);
  }
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:50% 50% 8px 8px;
    background:linear-gradient(160deg,var(--pine),var(--pine-deep));
    border:1.5px solid var(--gold);
    position:relative;flex:none;
  }
  .brand-mark::after{
    content:"";position:absolute;inset:8px;border:1px solid var(--gold-soft);
    border-radius:50% 50% 6px 6px;opacity:.7;
  }
  .brand-name{font-family:'Amiri',serif;font-size:19px;font-weight:700;line-height:1.15;}
  .brand-sub{font-size:11.5px;color:var(--sage);letter-spacing:.3px;}
  .who{display:flex;align-items:center;gap:14px;font-size:13.5px;}
  .who .tag{background:var(--pine);color:var(--cream);padding:4px 12px;border-radius:100px;font-size:12px;}
  .btn-ghost{
    background:transparent;border:1px solid rgba(19,40,33,0.25);color:var(--ink);
    padding:7px 16px;border-radius:100px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .btn-ghost:hover{border-color:var(--pine);}

  /* ---------- generic ---------- */
  .btn{
    background:var(--pine);color:#fff;border:none;padding:11px 22px;border-radius:10px;
    font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s transform,.15s background;
  }
  .btn:hover{background:var(--pine-deep);}
  .btn:active{transform:scale(.98);}
  .btn.gold{background:var(--gold);color:var(--pine-deep);}
  .btn.gold:hover{background:#bb8f47;}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#8f382e;}
  .btn.outline{background:transparent;border:1.5px solid var(--pine);color:var(--pine);}
  .btn.outline:hover{background:var(--pine);color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.small{padding:7px 14px;font-size:12.5px;border-radius:8px;}

  input[type=text],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=email],textarea,select{
    width:100%;padding:11px 14px;border-radius:9px;border:1.5px solid rgba(19,40,33,0.18);
    font-family:inherit;font-size:14.5px;background:#fff;color:var(--ink);outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--pine);box-shadow:0 0 0 3px rgba(31,92,74,0.12);}
  textarea{resize:vertical;min-height:80px;}
  label.field-label{display:block;font-size:13px;color:var(--pine-deep);margin-bottom:6px;font-weight:600;}

  .card{
    background:#fff;border:1px solid rgba(19,40,33,0.08);border-radius:16px;
    padding:26px;box-shadow:0 1px 2px rgba(19,40,33,0.04);
  }
  .muted{color:var(--sage);font-size:13px;}
  .error-box{background:#FBEAE7;color:#8f382e;border:1px solid #EAC3BC;padding:11px 14px;border-radius:9px;font-size:13.5px;margin-top:12px;}
  .success-box{background:#EAF4EF;color:var(--pine-deep);border:1px solid #CFE6DA;padding:11px 14px;border-radius:9px;font-size:13.5px;margin-top:12px;}

  /* ---------- login screen ---------- */
  .login-screen{min-height:calc(100vh - 71px);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .login-card{
    width:100%;max-width:420px;background:#fff;
    border:1px solid rgba(19,40,33,0.10);
    border-radius: var(--radius-arch);
    padding:44px 34px 32px;position:relative;
    box-shadow:0 20px 50px -20px rgba(19,40,33,0.25);
  }
  .arch-ornament{
    width:56px;height:56px;margin:0 auto 18px;border-radius:50% 50% 8px 8px;
    background:linear-gradient(160deg,var(--pine),var(--pine-deep));border:2px solid var(--gold);
    position:relative;
  }
  .arch-ornament::after{content:"";position:absolute;inset:11px;border:1px solid var(--gold-soft);border-radius:50% 50% 4px 4px;}
  .login-title{text-align:center;font-size:23px;margin:0 0 4px;}
  .login-sub{text-align:center;color:var(--sage);font-size:13.5px;margin-bottom:26px;}
  .tabs{display:flex;background:var(--cream-2);border-radius:100px;padding:4px;margin-bottom:22px;}
  .tab{flex:1;text-align:center;padding:9px 0;border-radius:100px;font-size:13.5px;cursor:pointer;font-weight:600;color:var(--sage);}
  .tab.active{background:var(--pine);color:#fff;}
  .field-gap{margin-bottom:14px;}
  .hint-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12.5px;}
  .link-btn{background:none;border:none;color:var(--pine);cursor:pointer;font-family:inherit;font-size:12.5px;text-decoration:underline;padding:0;}

  /* ---------- dashboard layout ---------- */
  .dash{padding:34px 0 80px;}
  .dash-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:14px;}
  .eyebrow{color:var(--gold);font-size:12px;letter-spacing:1.5px;font-weight:700;margin-bottom:6px;}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:30px;}
  .stat{background:#fff;border:1px solid rgba(19,40,33,0.08);border-radius:14px;padding:18px 20px;}
  .stat .num{font-family:'Amiri',serif;font-size:30px;color:var(--pine-deep);}
  .stat .lbl{font-size:12.5px;color:var(--sage);margin-top:2px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:right;color:var(--sage);font-weight:600;font-size:12px;padding:10px 12px;border-bottom:1.5px solid rgba(19,40,33,0.1);}
  td{padding:12px;border-bottom:1px solid rgba(19,40,33,0.06);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:3px 11px;border-radius:100px;font-size:11.5px;font-weight:600;}
  .badge.on{background:#EAF4EF;color:var(--pine-deep);}
  .badge.off{background:#FBEAE7;color:#8f382e;}
  .badge.device{background:var(--cream-2);color:var(--ink);font-family:monospace;}
  .code-chip{font-family:monospace;background:var(--cream-2);padding:3px 9px;border-radius:6px;font-size:12.5px;letter-spacing:.5px;}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .section-title{font-size:18px;margin:0 0 4px;}
  .section-block{margin-bottom:34px;}
  .table-wrap{overflow-x:auto;background:#fff;border:1px solid rgba(19,40,33,0.08);border-radius:14px;padding:6px 10px;}

  .modal-bg{position:fixed;inset:0;background:rgba(19,40,33,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:18px;padding:28px;max-width:460px;width:100%;max-height:88vh;overflow:auto;}

  /* ---------- form builder ---------- */
  .builder-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:820px){.builder-grid{grid-template-columns:1fr;}}
  .field-card{border:1.5px solid rgba(19,40,33,0.1);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--cream);}
  .field-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .field-type-pill{font-size:11px;background:var(--pine);color:#fff;padding:2px 10px;border-radius:100px;}
  .icon-btn{background:none;border:none;color:var(--sage);cursor:pointer;font-size:16px;padding:2px 6px;}
  .icon-btn:hover{color:var(--danger);}
  .add-field-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}

  .preview-shell{border:1.5px dashed rgba(19,40,33,0.18);border-radius:14px;padding:20px;background:var(--cream);}

  /* ---------- public form page ---------- */
  .public-wrap{max-width:640px;margin:0 auto;padding:50px 20px 80px;}
  .public-card{background:#fff;border-radius:22px;border:1px solid rgba(19,40,33,0.08);padding:38px 30px;box-shadow:0 20px 50px -25px rgba(19,40,33,0.25);}
  .public-header{text-align:center;margin-bottom:30px;}

  footer{text-align:center;padding:28px 0;color:var(--sage);font-size:12px;}

  .loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--sage);}
  .empty{text-align:center;padding:40px 20px;color:var(--sage);font-size:13.5px;}
  .copy-row{display:flex;gap:8px;}
  .copy-row input{font-family:monospace;font-size:12.5px;}
</style>
</head>
<body>

<div id="topbar-root"></div>
<div id="app" class="loading">در حال بارگذاری...</div>

<script>
/* ================= SUPABASE ================= */
const SUPABASE_URL = "https://nkmzlbvereblvtgfqtoe.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_rzwrq5k7KACTlpJWyzFSsA_z4_fS8IN";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= STATE / HELPERS ================= */
function getDeviceId(){
  let id = localStorage.getItem('mosque_device_id');
  if(!id){ id = crypto.randomUUID(); localStorage.setItem('mosque_device_id', id); }
  return id;
}
function getSession(){
  try{ return JSON.parse(localStorage.getItem('mosque_session')||'null'); }catch(e){ return null; }
}
function setSession(u){ localStorage.setItem('mosque_session', JSON.stringify(u)); }
function clearSession(){ localStorage.removeItem('mosque_session'); }
function genLicense(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<10;i++){ if(i===5) s+='-'; s+=chars[Math.floor(Math.random()*chars.length)]; }
  return s;
}
function genSlug(){
  const chars='abcdefghijkmnpqrstuvwxyz23456789';
  let s='';
  for(let i=0;i<8;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(d){
  try{ return new Date(d).toLocaleString('fa-IR'); }catch(e){ return d; }
}

const routeRoot = document.getElementById('app');
const topbarRoot = document.getElementById('topbar-root');

function renderTopbar(){
  const s = getSession();
  if(location.hash.startsWith('#/f/')){ topbarRoot.innerHTML=''; return; } // public form: no topbar
  topbarRoot.innerHTML = `
    <div class="topbar"><div class="wrap topbar-inner">
      <a href="#/" style="text-decoration:none;color:inherit;" class="brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-name">مسجد امیرالمؤمنین (ع)</div>
          <div class="brand-sub">سامانه فرم‌ساز و مدیریت ثبت‌نام</div>
        </div>
      </a>
      ${s ? `
        <div class="who">
          <div>
            <div style="font-weight:600;">${escapeHtml(s.name)}</div>
            <span class="tag">${s.role==='super_admin'?'سوپرادمین':'ادمین'}</span>
          </div>
          <button class="btn-ghost" id="logout-btn">خروج از حساب</button>
        </div>` : ``}
    </div></div>`;
  const lb = document.getElementById('logout-btn');
  if(lb) lb.onclick = doLogout;
}

async function doLogout(){
  const s = getSession();
  if(s){
    await sb.from('app_users').update({device_id:null}).eq('id', s.id);
  }
  clearSession();
  location.hash = '#/';
  boot();
}

/* ================= ROUTER ================= */
window.addEventListener('hashchange', boot);
window.addEventListener('DOMContentLoaded', boot);

async function boot(){
  renderTopbar();
  const hash = location.hash || '#/';

  if(hash.startsWith('#/f/')){
    const slug = hash.replace('#/f/','');
    return renderPublicForm(slug);
  }

  const s = getSession();
  if(!s){ return renderLogin(); }

  // re-validate session against DB (license could be revoked / device changed)
  const {data:u, error} = await sb.from('app_users').select('*').eq('id', s.id).single();
  if(error || !u || !u.is_active || u.device_id !== getDeviceId()){
    clearSession();
    return renderLogin(u && !u.is_active ? 'لایسنس شما توسط سوپرادمین باطل شده است.' : 'نشست شما معتبر نیست، دوباره وارد شوید.');
  }
  setSession(u);

  if(hash.startsWith('#/builder/')) return renderBuilder(u, hash.replace('#/builder/',''));
  if(hash.startsWith('#/submissions/')) return renderSubmissions(u, hash.replace('#/submissions/',''));
  if(u.role === 'super_admin') return renderSuperAdmin(u, hash);
  return renderAdmin(u);
}

/* ================= LOGIN / REGISTER ================= */
function renderLogin(flashError){
  let mode = 'login'; // login | register
  draw();

  function draw(){
    routeRoot.innerHTML = `
    <div class="login-screen"><div class="login-card">
      <div class="arch-ornament"></div>
      <h1 class="login-title">مسجد امیرالمؤمنین (ع)</h1>
      <div class="login-sub">سامانه فرم‌ساز و مدیریت ثبت‌نام</div>
      <div class="tabs">
        <div class="tab ${mode==='login'?'active':''}" data-m="login">ورود با لایسنس</div>
        <div class="tab ${mode==='register'?'active':''}" data-m="register">فعال‌سازی لایسنس جدید</div>
      </div>
      <form id="login-form">
        <div class="field-gap">
          <label class="field-label">شماره موبایل</label>
          <input type="tel" id="f-phone" placeholder="09xxxxxxxxx" required>
        </div>
        <div class="field-gap">
          <label class="field-label">نام و نام خانوادگی</label>
          <input type="text" id="f-name" placeholder="مثلاً: علی رضایی" required>
        </div>
        <div class="field-gap">
          <label class="field-label">کد لایسنس</label>
          <input type="text" id="f-license" placeholder="XXXXX-XXXXX" required style="font-family:monospace;">
        </div>
        <div id="login-msg"></div>
        <div style="margin-top:18px;">
          <button class="btn" type="submit" style="width:100%;" id="submit-btn">
            ${mode==='login' ? 'ورود به سامانه' : 'فعال‌سازی و ورود'}
          </button>
        </div>
      </form>
      <div class="hint-row">
        <span class="muted">لایسنس فقط روی یک دستگاه فعال می‌شود.</span>
      </div>
    </div></div>`;

    if(flashError){
      document.getElementById('login-msg').innerHTML = `<div class="error-box">${escapeHtml(flashError)}</div>`;
      flashError = null;
    }

    document.querySelectorAll('.tab').forEach(t=> t.onclick = ()=>{ mode = t.dataset.m; draw(); });
    document.getElementById('login-form').onsubmit = (e)=>{ e.preventDefault(); mode==='login' ? doLogin() : doRegister(); };
  }

  async function doLogin(){
    const phone = document.getElementById('f-phone').value.trim();
    const name = document.getElementById('f-name').value.trim();
    const license = document.getElementById('f-license').value.trim().toUpperCase();
    const msg = document.getElementById('login-msg');
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; msg.innerHTML='';

    const {data:u, error} = await sb.from('app_users').select('*').eq('phone', phone).eq('license_key', license).maybeSingle();
    if(error || !u){ msg.innerHTML = `<div class="error-box">شماره یا کد لایسنس اشتباه است.</div>`; btn.disabled=false; return; }
    if(u.name.trim() !== name){ msg.innerHTML = `<div class="error-box">نام وارد شده با نام ثبت‌شده مطابقت ندارد.</div>`; btn.disabled=false; return; }
    if(!u.is_active){ msg.innerHTML = `<div class="error-box">این لایسنس باطل شده است. با سوپرادمین تماس بگیرید.</div>`; btn.disabled=false; return; }

    const device = getDeviceId();
    if(u.device_id && u.device_id !== device){
      msg.innerHTML = `<div class="error-box">این لایسنس هم‌اکنون روی دستگاه دیگری فعال است. برای انتقال، ابتدا از دستگاه قبلی خارج شوید یا از سوپرادمین بخواهید نشست را پایان دهد.</div>`;
      btn.disabled = false; return;
    }
    if(!u.device_id){
      const {error: upErr} = await sb.from('app_users').update({device_id: device}).eq('id', u.id);
      if(upErr){ msg.innerHTML = `<div class="error-box">خطا در فعال‌سازی دستگاه.</div>`; btn.disabled=false; return; }
      u.device_id = device;
    }
    setSession(u);
    location.hash = '#/';
    boot();
  }

  async function doRegister(){
    // "register" here just means: first-time activation of a license someone already gave you.
    // It runs the exact same check as login (a license row must already exist, created by super admin or self-seed).
    return doLogin();
  }
}

/* ================= SUPER ADMIN ================= */
async function renderSuperAdmin(me, hash){
  routeRoot.className='';
  routeRoot.innerHTML = `<div class="wrap"><div class="loading">در حال بارگذاری اطلاعات...</div></div>`;

  const [{data:admins}, {data:forms}, {data:subs}] = await Promise.all([
    sb.from('app_users').select('*').order('created_at',{ascending:false}),
    sb.from('forms').select('*').order('created_at',{ascending:false}),
    sb.from('submissions').select('id, form_id')
  ]);

  const adminCount = (admins||[]).filter(a=>a.role==='admin').length;
  const activeCount = (admins||[]).filter(a=>a.role==='admin' && a.is_active).length;

  routeRoot.innerHTML = `
  <div class="wrap dash">
    <div class="dash-head">
      <div>
        <div class="eyebrow">پنل سوپرادمین</div>
        <h2 class="section-title" style="font-size:26px;">مدیریت لایسنس‌ها و فرم‌ها</h2>
      </div>
      <button class="btn gold" id="new-license-btn">صدور لایسنس ادمین جدید</button>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="num">${adminCount}</div><div class="lbl">تعداد ادمین</div></div>
      <div class="stat"><div class="num">${activeCount}</div><div class="lbl">لایسنس فعال</div></div>
      <div class="stat"><div class="num">${(forms||[]).length}</div><div class="lbl">فرم ساخته‌شده</div></div>
      <div class="stat"><div class="num">${(subs||[]).length}</div><div class="lbl">پاسخ ثبت‌شده</div></div>
    </div>

    <div class="section-block">
      <h3 class="section-title">لایسنس‌ها و کاربران</h3>
      <p class="muted" style="margin-top:0;">هر لایسنس فقط روی یک دستگاه فعال می‌شود. برای جابه‌جایی دستگاه، اول باید نشست فعلی پایان یابد.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>نام</th><th>شماره</th><th>نقش</th><th>کد لایسنس</th><th>وضعیت دستگاه</th><th>وضعیت لایسنس</th><th>عملیات</th></tr></thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="section-block">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 class="section-title">فرم‌های ساخته‌شده</h3>
        <button class="btn outline small" id="new-form-btn">+ فرم جدید</button>
      </div>
      <div class="table-wrap" style="margin-top:12px;">
        <table>
          <thead><tr><th>عنوان فرم</th><th>سازنده</th><th>پاسخ‌ها</th><th>وضعیت</th><th>عملیات</th></tr></thead>
          <tbody id="forms-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>`;

  const usersTb = document.getElementById('users-tbody');
  usersTb.innerHTML = (admins||[]).map(u=>{
    const deviceBadge = u.device_id ? `<span class="badge device">دستگاه متصل</span>` : `<span class="muted">بدون دستگاه</span>`;
    const statusBadge = u.is_active ? `<span class="badge on">فعال</span>` : `<span class="badge off">باطل</span>`;
    const isSelf = u.id === me.id;
    return `<tr>
      <td>${escapeHtml(u.name)}${isSelf?' <span class="muted">(خودم)</span>':''}</td>

/* ================= FORM BUILDER ================= */
const FIELD_TYPES = [
  {v:'text', l:'متن کوتاه'},
  {v:'textarea', l:'متن بلند'},
  {v:'phone', l:'شماره موبایل'},
  {v:'number', l:'عدد'},
  {v:'date', l:'تاریخ'},
  {v:'select', l:'انتخابی (تک‌گزینه‌ای)'},
  {v:'checkbox', l:'چندگزینه‌ای'},
];

async function renderBuilder(me, formId){
  routeRoot.innerHTML = `<div class="wrap"><div class="loading">در حال بارگذاری فرم...</div></div>`;
  const {data:form, error} = await sb.from('forms').select('*').eq('id', formId).single();
  if(error || !form || (me.role!=='super_admin' && form.created_by !== me.id)){
    routeRoot.innerHTML = `<div class="wrap"><div class="empty">این فرم پیدا نشد یا به آن دسترسی نداری.</div></div>`;
    return;
  }
  let fields = JSON.parse(JSON.stringify(form.fields || []));
  const publicUrl = `${location.origin}${location.pathname}#/f/${form.public_slug}`;

  draw();

  function draw(){
    routeRoot.innerHTML = `
    <div class="wrap dash">
      <div class="dash-head">
        <div>
          <div class="eyebrow">فرم‌ساز</div>
          <h2 class="section-title" style="font-size:24px;">${escapeHtml(form.title)}</h2>
        </div>
        <div class="row-actions">
          <a href="#/"><button class="btn-ghost">بازگشت</button></a>
          <button class="btn gold" id="save-btn">ذخیره تغییرات</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:22px;">
        <label class="field-label">لینک عمومی فرم — این را برای شرکت‌کننده‌ها بفرست</label>
        <div class="copy-row">
          <input type="text" readonly value="${publicUrl}" id="pub-link">
          <button class="btn outline small" id="copy-pub">کپی لینک</button>
        </div>
      </div>

      <div class="builder-grid">
        <div>
          <h3 class="section-title">فیلدهای فرم</h3>
          <div id="fields-list"></div>
          <div class="add-field-row">
            ${FIELD_TYPES.map(t=>`<button class="btn-ghost small-ghost" style="font-size:12.5px;padding:6px 12px;" data-addtype="${t.v}">+ ${t.l}</button>`).join('')}
          </div>
        </div>
        <div>
          <h3 class="section-title">پیش‌نمایش زنده</h3>
          <div class="preview-shell" id="preview-shell"></div>
        </div>
      </div>
    </div>`;

    document.getElementById('copy-pub').onclick = ()=> navigator.clipboard.writeText(publicUrl);
    document.getElementById('save-btn').onclick = saveForm;
    document.querySelectorAll('[data-addtype]').forEach(b=> b.onclick = ()=>{
      fields.push({id:crypto.randomUUID(), type:b.dataset.addtype, label:'برچسب فیلد جدید', required:false, options: (b.dataset.addtype==='select'||b.dataset.addtype==='checkbox') ? ['گزینه ۱','گزینه ۲'] : undefined});
      draw();
    });

    drawFieldsList();
    drawPreview();
  }

  function drawFieldsList(){
    const list = document.getElementById('fields-list');
    if(!fields.length){ list.innerHTML = `<div class="empty">هنوز فیلدی اضافه نشده. از دکمه‌های پایین یک نوع فیلد اضافه کن.</div>`; return; }
    list.innerHTML = fields.map((f,i)=>`
      <div class="field-card" data-idx="${i}">
        <div class="field-card-head">
          <span class="field-type-pill">${FIELD_TYPES.find(t=>t.v===f.type)?.l || f.type}</span>
          <button class="icon-btn" data-remove="${i}" title="حذف فیلد">حذف</button>
        </div>
        <div class="field-gap"><label class="field-label">برچسب فیلد</label><input type="text" data-label="${i}" value="${escapeHtml(f.label)}"></div>
        ${(f.type==='select'||f.type==='checkbox') ? `
          <div class="field-gap"><label class="field-label">گزینه‌ها (هرکدام در یک خط)</label>
          <textarea data-options="${i}">${escapeHtml((f.options||[]).join('\\n'))}</textarea></div>` : ''}
        <label style="display:flex;align-items:center;gap:7px;font-size:13px;">
          <input type="checkbox" data-required="${i}" ${f.required?'checked':''} style="width:auto;"> اجباری باشد
        </label>
      </div>`).join('');

    list.querySelectorAll('[data-remove]').forEach(b=> b.onclick = ()=>{ fields.splice(+b.dataset.remove,1); draw(); });
    list.querySelectorAll('[data-label]').forEach(inp=> inp.oninput = ()=>{ fields[+inp.dataset.label].label = inp.value; drawPreview(); });
    list.querySelectorAll('[data-required]').forEach(inp=> inp.onchange = ()=>{ fields[+inp.dataset.required].required = inp.checked; drawPreview(); });
    list.querySelectorAll('[data-options]').forEach(inp=> inp.oninput = ()=>{ fields[+inp.dataset.options].options = inp.value.split('\\n').map(s=>s.trim()).filter(Boolean); drawPreview(); });
  }

  function drawPreview(){
    const shell = document.getElementById('preview-shell');
    shell.innerHTML = renderFieldsAsHtml(fields, true);
  }

  async function saveForm(){
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'در حال ذخیره...';
    const {error} = await sb.from('forms').update({fields}).eq('id', form.id);
    btn.disabled = false;
    if(error){ btn.textContent = 'خطا! دوباره تلاش کن'; }
    else { btn.textContent = 'ذخیره شد'; setTimeout(()=> btn.textContent='ذخیره تغییرات', 1500); }
  }
}

function renderFieldsAsHtml(fields, preview){
  if(!fields.length) return `<div class="empty">فیلدی برای نمایش نیست.</div>`;
  return fields.map(f=>{
    const req = f.required ? 'required' : '';
    const star = f.required ? ' *' : '';
    let input='';
    if(f.type==='textarea') input = `<textarea name="${f.id}" ${req} ${preview?'disabled':''}></textarea>`;
    else if(f.type==='select') input = `<select name="${f.id}" ${req} ${preview?'disabled':''}><option value="">انتخاب کنید</option>${(f.options||[]).map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}</select>`;
    else if(f.type==='checkbox') input = (f.options||[]).map(o=>`<label style="display:flex;align-items:center;gap:7px;font-size:13.5px;margin:6px 0;"><input type="checkbox" name="${f.id}" value="${escapeHtml(o)}" style="width:auto;" ${preview?'disabled':''}> ${escapeHtml(o)}</label>`).join('');
    else if(f.type==='phone') input = `<input type="tel" name="${f.id}" ${req} placeholder="09xxxxxxxxx" ${preview?'disabled':''}>`;
    else if(f.type==='number') input = `<input type="number" name="${f.id}" ${req} ${preview?'disabled':''}>`;
    else if(f.type==='date') input = `<input type="date" name="${f.id}" ${req} ${preview?'disabled':''}>`;
    else input = `<input type="text" name="${f.id}" ${req} ${preview?'disabled':''}>`;
    return `<div class="field-gap"><label class="field-label">${escapeHtml(f.label)}${star}</label>${input}</div>`;
  }).join('');
}

  };
}
function formatAnswer(val, field){
  if(val==null) return '';
  if(Array.isArray(val)) return val.join('، ');
  return String(val);
}

/* ================= PUBLIC FORM ================= */
async function renderPublicForm(slug){
  routeRoot.innerHTML = `<div class="wrap"><div class="loading">در حال بارگذاری فرم...</div></div>`;
  const {data:form, error} = await sb.from('forms').select('*').eq('public_slug', slug).maybeSingle();

  if(error || !form){
    routeRoot.innerHTML = `<div class="public-wrap"><div class="public-card"><div class="empty">این فرم پیدا نشد.</div></div></div>`;
    return;
  }
  if(!form.is_active){
    routeRoot.innerHTML = `<div class="public-wrap"><div class="public-card"><div class="public-header">
      <div class="arch-ornament"></div><h2 class="login-title">فرم بسته شده است</h2>
      <p class="muted">مهلت ثبت‌نام برای این فرم به پایان رسیده است.</p></div></div></div>`;
    return;
  }

  const fields = form.fields || [];
  routeRoot.innerHTML = `
  <div class="public-wrap"><div class="public-card">
    <div class="public-header">
      <div class="arch-ornament"></div>
      <h2 class="login-title">${escapeHtml(form.title)}</h2>
      ${form.description ? `<p class="muted" style="margin-top:8px;">${escapeHtml(form.description)}</p>` : ''}
    </div>
    <form id="public-form">
      ${renderFieldsAsHtml(fields, false)}
      <div id="pf-msg"></div>
      <button class="btn" type="submit" style="width:100%;margin-top:8px;">ثبت پاسخ</button>
    </form>
  </div></div>`;

  document.getElementById('public-form').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {};
    let missing = false;
    fields.forEach(f=>{
      if(f.type==='checkbox'){
        const vals = fd.getAll(f.id);
        data[f.id] = vals;
        if(f.required && vals.length===0) missing = true;
      } else {
        const v = (fd.get(f.id)||'').toString().trim();
        data[f.id] = v;
        if(f.required && !v) missing = true;
      }
    });
    const msg = document.getElementById('pf-msg');
    if(missing){ msg.innerHTML = `<div class="error-box">لطفاً فیلدهای اجباری (*) را کامل کن.</div>`; return; }
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'در حال ارسال...';
    const {error} = await sb.from('submissions').insert({form_id: form.id, data});
    if(error){
      msg.innerHTML = `<div class="error-box">خطا در ارسال، دوباره تلاش کن.</div>`;
      btn.disabled = false; btn.textContent = 'ثبت پاسخ';
      return;
    }
    document.getElementById('public-form').innerHTML = `<div class="success-box" style="text-align:center;padding:20px;">پاسخ شما با موفقیت ثبت شد. سپاس از همراهی شما.</div>`;
  };
}
